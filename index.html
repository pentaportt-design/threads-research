<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>땡초장 Threads 리서치</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #E8341A;
  --red-dark: #B8240D;
  --red-light: #FF5C3F;
  --orange: #F5622A;
  --bg: #0C0C0C;
  --bg2: #141414;
  --bg3: #1C1C1C;
  --bg4: #242424;
  --border: rgba(255,255,255,0.07);
  --text: #F0EDE8;
  --text-muted: #888;
  --text-dim: #555;
  --green: #2ECC71;
  --yellow: #F1C40F;
  --mono: 'Space Mono', monospace;
  --sans: 'Noto Sans KR', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Grain overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
}

/* Header */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(12,12,12,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.02em;
}

.logo-dot {
  width: 8px; height: 8px;
  background: var(--red);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--red);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%,100% { box-shadow: 0 0 8px var(--red); }
  50% { box-shadow: 0 0 16px var(--red), 0 0 32px rgba(232,52,26,0.3); }
}

.header-meta">{
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 16px;
}

.status-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  background: rgba(46,204,113,0.1);
  border: 1px solid rgba(46,204,113,0.2);
  border-radius: 4px;
  color: var(--green);
  font-size: 11px;
}
.status-dot { width:5px; height:5px; background:var(--green); border-radius:50%; animation: pulse-g 2s infinite; }
@keyframes pulse-g { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Main layout */
main {
  max-width: 1280px;
  margin: 0 auto;
  padding: 32px 24px;
  position: relative;
  z-index: 1;
}

/* Hero stats */
.hero-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}

.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s;
}
.stat-card:hover { border-color: rgba(255,255,255,0.15); }
.stat-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent, var(--red));
}

.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}
.stat-value {
  font-size: 32px;
  font-weight: 900;
  line-height: 1;
  font-family: var(--mono);
}
.stat-sub {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px;
  width: fit-content;
}

.tab {
  padding: 8px 20px;
  border-radius: 5px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
  background: none;
  color: var(--text-muted);
  font-family: var(--sans);
  display: flex;
  align-items: center;
  gap: 7px;
}
.tab:hover { color: var(--text); }
.tab.active {
  background: var(--red);
  color: #fff;
  font-weight: 700;
}
.tab .count {
  font-family: var(--mono);
  font-size: 11px;
  background: rgba(255,255,255,0.15);
  padding: 1px 5px;
  border-radius: 3px;
}

/* Filter bar */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-label {
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--mono);
  text-transform: uppercase;
}

.filter-chip {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: none;
  color: var(--text-muted);
  font-family: var(--sans);
  transition: all 0.15s;
}
.filter-chip:hover { border-color: var(--red); color: var(--text); }
.filter-chip.active {
  background: rgba(232,52,26,0.1);
  border-color: var(--red);
  color: var(--red);
}

/* Content sections */
.section { display: none; }
.section.active { display: block; }

/* Post grid */
.post-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 14px;
}

.post-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
  transition: all 0.2s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.post-card:hover {
  border-color: rgba(232,52,26,0.3);
  background: var(--bg3);
  transform: translateY(-1px);
}

.post-card.viral::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 10px;
  border: 1px solid rgba(232,52,26,0.4);
  pointer-events: none;
}

.post-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.post-author {
  display: flex;
  align-items: center;
  gap: 9px;
}

.avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
}

.author-name {
  font-size: 13px;
  font-weight: 700;
}
.author-handle {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--mono);
}

.viral-badge {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  background: rgba(232,52,26,0.12);
  border: 1px solid rgba(232,52,26,0.25);
  border-radius: 4px;
  font-size: 10px;
  font-family: var(--mono);
  font-weight: 700;
  color: var(--red-light);
  letter-spacing: 0.05em;
}

.category-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}

.post-content {
  font-size: 13px;
  line-height: 1.65;
  color: #CCC;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.post-stats {
  display: flex;
  gap: 16px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-muted);
  align-items: center;
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 5px;
}
.stat-item.views { color: var(--text); font-weight: 700; }
.stat-item.views .num { color: var(--red-light); }

.post-time {
  margin-left: auto;
  font-size: 10px;
  color: var(--text-dim);
}

/* Rank table for growing accounts */
.rank-table {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.rank-header {
  display: grid;
  grid-template-columns: 48px 1fr 120px 120px 100px 80px;
  padding: 10px 16px;
  font-size: 11px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  background: var(--bg3);
}

.rank-row {
  display: grid;
  grid-template-columns: 48px 1fr 120px 120px 100px 80px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  transition: background 0.15s;
  cursor: pointer;
}
.rank-row:last-child { border-bottom: none; }
.rank-row:hover { background: var(--bg3); }

.rank-num {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 14px;
  color: var(--text-dim);
}
.rank-num.top { color: var(--red); }

.account-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.follower-gain {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 4px;
}

.growth-bar-wrap {
  height: 4px;
  background: var(--bg4);
  border-radius: 2px;
  overflow: hidden;
  flex: 1;
  max-width: 80px;
}
.growth-bar {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--red), var(--orange));
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
}

/* Trend chart area */
.keyword-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

.keyword-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
  transition: all 0.2s;
}
.keyword-card:hover { border-color: rgba(255,255,255,0.15); }

.keyword-name {
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.keyword-count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 14px;
}
.keyword-posts {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.keyword-post-item {
  font-size: 12px;
  color: var(--text-muted);
  padding: 6px 8px;
  background: var(--bg3);
  border-radius: 4px;
  line-height: 1.5;
  display: flex;
  align-items: flex-start;
  gap: 6px;
}
.keyword-post-item::before {
  content: '—';
  color: var(--text-dim);
  flex-shrink: 0;
  margin-top: 1px;
}

/* Empty / loading state */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
}
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.empty-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); }
.empty-desc { font-size: 13px; line-height: 1.6; }

/* Last updated bar */
.update-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 12px;
}
.update-bar .left { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-family: var(--mono); }
.update-bar .right { color: var(--text-dim); font-size: 11px; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

/* Responsive */
@media (max-width: 768px) {
  main { padding: 16px; }
  .hero-stats { grid-template-columns: repeat(2, 1fr); }
  .post-grid { grid-template-columns: 1fr; }
  .rank-header, .rank-row { grid-template-columns: 40px 1fr 90px 90px; }
  .rank-header span:nth-child(5),
  .rank-header span:nth-child(6),
  .rank-row > *:nth-child(5),
  .rank-row > *:nth-child(6) { display: none; }
  header { padding: 0 16px; }
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.post-card, .rank-row, .keyword-card {
  animation: fadeIn 0.3s ease both;
}
</style>
</head>

  <div class="section" id="section-growth">
    <div class="rank-table">

  <div class="section" id="section-keywords">
    <div class="keyword-grid" id="keyword-grid"></div>
  </div>

</main>

// ── 현재 필터 상태 ────────────────────────────────────
let currentFilter = 'all';
let currentTab = 'viral';

// ── 탭 전환 ───────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('section-' + tab).classList.add('active');
}

// ── 게시글 필터 ───────────────────────────────────────
function filterPosts(category, el) {
  currentFilter = category;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderPosts(window._data);
}

// ── 조회수 포맷 ───────────────────────────────────────
function fmtViews(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + '만';
  if (n >= 1000) return (n / 1000).toFixed(1) + '천';
  return n.toString();
}
function fmtFollowers(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + '만';
  return n.toLocaleString();
}

// ── 게시글 렌더링 ─────────────────────────────────────
function renderPosts(data) {
  const grid = document.getElementById('post-grid');
  const posts = data.viral_posts.filter(p =>
    currentFilter === 'all' || p.category === currentFilter
  );

  if (!posts.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">해당 카테고리 게시글 없음</div>
      <div class="empty-desc">수집 스크립트 실행 후 data.json이 업데이트되면<br>여기에 자동으로 표시됩니다.</div>
    </div>`;
    return;
  }

  grid.innerHTML = posts.map((p, i) => {
    const cat = CATEGORIES[p.category] || { emoji: '📌', color: '#888', bg: 'rgba(136,136,136,0.1)' };
    const isViral = p.views >= 100000;
    return `<div class="post-card ${isViral ? 'viral' : ''}" style="animation-delay:${i*0.04}s"
      onclick="window.open('https://www.threads.net/@${p.username}','_blank')">
      <div class="post-header">
        <div class="post-author">
          <div class="avatar" style="background:${p.avatar_color}22;color:${p.avatar_color}">
            ${p.display_name[0]}
          </div>
          <div>
            <div class="author-name">${p.display_name}</div>
            <div class="author-handle">@${p.username}</div>
          </div>
        </div>
        ${isViral ? '<div class="viral-badge">🔥 VIRAL</div>' : ''}
      </div>
      <div class="category-tag" style="background:${cat.bg};color:${cat.color}">
        ${cat.emoji} ${p.category}
      </div>
      <div class="post-content">${p.content}</div>
      <div class="post-stats">
        <div class="stat-item views">👁 <span class="num">${fmtViews(p.views)}</span></div>
        <div class="stat-item">❤️ ${fmtViews(p.likes)}</div>
        <div class="stat-item">💬 ${p.comments}</div>
        <div class="post-time">${p.hours_ago}시간 전</div>
      </div>
    </div>`;
  }).join('');
}

// ── 성장 계정 렌더링 ──────────────────────────────────
function renderGrowth(data) {
  const list = document.getElementById('growth-list');
  const maxGain = Math.max(...data.growing_accounts.map(a => a.followers_gain));
  list.innerHTML = data.growing_accounts.map((a, i) => {
    const cat = CATEGORIES[a.category] || { emoji: '📌', color: '#888', bg: 'rgba(136,136,136,0.1)' };
    const barWidth = Math.round((a.followers_gain / maxGain) * 100);
    return `<div class="rank-row" onclick="window.open('https://www.threads.net/@${a.username}','_blank')">
      <div class="rank-num ${i < 3 ? 'top' : ''}">${i + 1}</div>
      <div class="account-info">
        <div class="avatar" style="width:30px;height:30px;font-size:12px;background:${a.avatar_color}22;color:${a.avatar_color}">
          ${a.display_name[0]}
        </div>
        <div>
          <div style="font-size:13px;font-weight:700">${a.display_name}</div>
          <div style="font-size:11px;color:var(--text-muted);font-family:var(--mono)">@${a.username}</div>
        </div>
      </div>
      <div class="follower-gain">▲ ${a.followers_gain.toLocaleString()}</div>
      <div style="font-family:var(--mono);font-size:13px">${fmtFollowers(a.followers_total)}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="growth-bar-wrap"><div class="growth-bar" style="width:${barWidth}%"></div></div>
        <span style="font-family:var(--mono);font-size:11px;color:var(--text-muted)">+${a.growth_rate}%</span>
      </div>
      <div class="category-tag" style="background:${cat.bg};color:${cat.color};margin-bottom:0">
        ${cat.emoji} ${a.category}
      </div>
    </div>`;
  }).join('');
}

// ── 키워드 트렌드 렌더링 ──────────────────────────────
function renderKeywords(data) {
  const grid = document.getElementById('keyword-grid');
  const maxCount = Math.max(...data.keywords.map(k => k.post_count));
  grid.innerHTML = data.keywords.map((k, i) => {
    const cat = CATEGORIES[k.name] || { color: '#888' };
    return `<div class="keyword-card" style="animation-delay:${i*0.06}s">
      <div class="keyword-name" style="color:${cat.color}">
        ${k.emoji} ${k.name}
        <span style="font-family:var(--mono);font-size:12px;color:var(--text-dim);font-weight:400">
          HOT ${Math.round((k.post_count/maxCount)*100)}
        </span>
      </div>
      <div class="keyword-count">${k.post_count}개 게시글 수집됨</div>
      <div style="height:4px;background:var(--bg4);border-radius:2px;margin-bottom:14px;overflow:hidden">
        <div style="height:100%;width:${Math.round((k.post_count/maxCount)*100)}%;background:${cat.color};border-radius:2px"></div>
      </div>
      <div class="keyword-posts">
        ${k.top_posts.map(p => `<div class="keyword-post-item">${p}</div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

// ── 전체 렌더링 ───────────────────────────────────────
function renderAll(data) {
  window._data = data;

  // 통계
  document.getElementById('stat-viral').textContent = data.viral_posts.filter(p => p.views >= 10000).length;
  document.getElementById('stat-growing').textContent = data.growing_accounts.length;
  document.getElementById('stat-total').textContent = data.viral_posts.length + data.growing_accounts.length * 3;

  // 탭 카운트
  document.getElementById('tab-count-viral').textContent = data.viral_posts.length;
  document.getElementById('tab-count-growth').textContent = data.growing_accounts.length;
  document.getElementById('tab-count-keywords').textContent = data.keywords.length;

  // 업데이트 시간
  const dt = new Date(data.updated_at);
  const timeStr = `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
  document.getElementById('update-time').textContent = timeStr;
  document.getElementById('last-update').textContent = timeStr;

  renderPosts(data);
  renderGrowth(data);
  renderKeywords(data);
}

// ── 데이터 로드 ───────────────────────────────────────
// GitHub Actions가 생성한 data.json을 먼저 시도, 없으면 샘플 사용
async function loadData() {
  try {
    const res = await fetch('./data.json?t=' + Date.now());
    if (res.ok) {
      const data = await res.json();
      renderAll(data);
      return;
    }
  } catch (e) {}
  // 샘플 데이터 사용 (수집 전 미리보기용)
  renderAll(SAMPLE_DATA);
}

loadData();
</script>
